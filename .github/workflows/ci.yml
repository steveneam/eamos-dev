name: CI

# Merge gate for the Forj parallel-agent protocol. `main` is protected with these
# checks required (enforce_admins off — solo/Codex direct pushes bypass by design;
# agent/* lane branches go through the PR + CI gate).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint + vercel guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run guard:vercel
      - run: npm run lint

  frontend:
    name: frontend (lint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: pip install -r requirements.txt
      # Two integration tests need gitignored data assets absent on a clean CI runner
      # (a PDF fixture; a real local source file → 'missing_local_file'). Deselected to keep
      # the gate deterministic. FOLLOW-UP (Codex, backend lane): mark them skipif-asset-absent
      # so they self-skip instead of being pinned here by node id.
      - run: >
          pytest -q
          --deselect tests/test_pdf_text.py::test_extract_fitz_engine
          --deselect tests/test_source_reader_proofs.py::test_source_reader_proofs_report_real_file_smokes_and_native_pending
