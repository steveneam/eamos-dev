name: CI

# Merge gate for the Forj parallel-agent protocol. `main` is protected with these
# checks required (enforce_admins off — solo/Codex direct pushes bypass by design;
# agent/* lane branches go through the PR + CI gate).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck + lint + vercel guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run guard:vercel
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint

  frontend:
    name: frontend (lint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  backend_tests:
    name: backend tests (shard ${{ matrix.shard_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1/2
          - shard_index: 1
            shard_label: 2/2
    defaults:
      run:
        working-directory: app/backend
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q --eamos-shard-count=2 --eamos-shard-index=${{ matrix.shard_index }}

  backend:
    name: backend (pytest)
    if: ${{ always() }}
    needs: backend_tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all backend shards passed
        env:
          SHARD_RESULT: ${{ needs.backend_tests.result }}
        run: test "$SHARD_RESULT" = "success"
