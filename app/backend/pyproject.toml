[project]
name = "eamos-backend"
version = "0.1.0"
description = "Eamos genomic intelligence platform — FastAPI backend"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# -n auto parallelizes the backend suite across all available cores (pytest-xdist).
# For a quick single-file run without worker spawn overhead, add -n0.
addopts = "-q -n auto"
testpaths = ["tests"]
markers = [
    "report_cache_contract: fast report-cache contract checks for ordinary feature commits",
    "slow: slower legacy or integration-style checks that are outside the fast feature gate",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
